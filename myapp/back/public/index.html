<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inici</title>
    <!-- SweetAlert2 per als avisos de la sessió -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
    <style>
        .custom-tooltip {
            --bs-tooltip-bg: var(--bs-primary);
            --bs-tooltip-color: var(--bs-white);
        }
    </style>
<body class="bg-body-tertiary">
    <div class="position-absolute top-50 start-50 translate-middle">
      <!-- TARGETA -->
       <h1 class="fw-bolder fs-1 text-primary w-100 p-3"> PREGUNTES AUTOESCOLA </h1>
      <div class="card shadow-sm">
        <div class="card-body p-4">

        <!-- INICI DE SESSIÓ -->
        <div class="d-flex justify-content-center align-items-center gap-2 py-2 ms-3">

            <!-- Campo para introducir el nombre -->
            <input type="text" placeholder="Posa el teu nom" id="inputNom" class="form-control form-control-sm w-auto">

            <!-- Aquí aparecerá el mensaje de bienvenida -->
            <span class="fs-5" id="divBenvinguda"></span>

            <!-- Botón para iniciar sesión -->
            <button class="btn btn-outline-primary btn-sm" id="btnGuardar">Iniciar Sessió</button>

            <!-- Botón para cerrar/borrar sesión -->
            <button class=" btn btn-outline-danger btn-sm d-none" id="btnEsborrar">
                <i class="bi bi-box-arrow-right" ></i>
            </button>
        </div>

        <!-- OPCIONS: d-none les amaga; inici.js les ensenya quan hi ha sessió -->
        <div id="divOpcions" class="d-none">
         <div class="d-flex flex-wrap justify-content-center align-items-center gap-2 py-2 ms-3">
            <a href="quiz.html" class=" btn btn-primary"
            data-bs-toggle="tooltip"
            data-bs-custom-class="custom-tooltip"
            data-bs-title="Quan comenci el quiz tindrà 20 segons per a respondre, bona sort!">Començar Quiz</a>
        </div>
         <div class="d-flex flex-wrap justify-content-center align-items-center gap-2 py-2 ms-3">
            <a href="interfaz.html" class=" btn btn-outline-primary">Gestionar Preguntes</a>
        </div>
        </div>
        </div> <!-- /card-body -->
      </div> <!-- /card -->
    </div>
    
</body>
    <!-- JavaScript de Bootstrap (el bundle ja incluye Popper, que necesitan los tooltips) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="inici.js"></script>
</html>
