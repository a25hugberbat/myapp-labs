<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Joc Preguntes</title>
</head>

<body>

    <!-- Marcador -->
    <div id="marcador" class="sticky-sm-top"></div>

    <!-- Contenedor principal -->
    <!-- max-width limita el ancho de la página a 640px -->
    <div class="container" style="max-width: 640px;">

        <!-- Título principal -->
        <h1 class="text-center fw-bolder fs-4 mt-2 mb-2"> PREGUNTES AUTOESCOLA </h1>


        <!-- ====================================================== -->
        <!-- CRONÓMETRO E INICIO DE SESIÓN                          -->
        <!-- ====================================================== -->

        <!-- Contenedor general de cronómetro + sesión -->
        <div class="pb-2 mb-2 border-bottom">


            <!-- ===================== -->
            <!-- FILA DEL CRONÓMETRO    -->
            <!-- ===================== -->

            <!-- 
                text-center:
                centra los elementos horizontalmente.

                mb-2:
                añade un pequeño margen inferior.
            -->
            <div class="text-center mb-2">

                <!-- Botón para iniciar el cronómetro -->
                <button id="btnIniciarCronometre" class="btn btn-primary btn-sm">
                    <!-- Icono Play de Bootstrap -->
                    <i class="bi bi-play-fill"></i>
                </button>

                <!-- Texto del cronómetro -->
                <span class="fw-bold">
                    Temps: 
                    <span id="cronometre">0</span>s
                </span>

            </div>


            <!-- ========================== -->
            <!-- FILA DEL INICIO DE SESIÓN  -->
            <!-- ========================== -->

            <!-- 
                d-flex:
                coloca los elementos en una fila.

                justify-content-center:
                centra los elementos horizontalmente.

                align-items-center:
                alinea los elementos verticalmente.

                gap-2:
                deja espacio entre los elementos.
            -->
            <div class="d-flex justify-content-center align-items-center gap-2">

                <!-- Campo para introducir el nombre -->
                <input type="text" placeholder="Posa el teu nom" id="inputNom" class="form-control form-control-sm w-auto">

                <!-- Aquí aparecerá el mensaje de bienvenida -->
                <span class="small" id="divBenvinguda"></span>


                <!-- Botón para iniciar sesión -->
                <button class="btn btn-outline-primary btn-sm" id="btnGuardar">Iniciar Sessió
                </button>


                <!-- Botón para cerrar/borrar sesión -->
                <button class="btn btn-outline-danger btn-sm" id="btnEsborrar">
                    <!-- Icono de salir de Bootstrap -->
                    <i class="bi bi-box-arrow-right"></i>
                </button>

            </div>

        </div>


        <!-- ====================================================== -->
        <!-- PARTIDA / PREGUNTAS                                    -->
        <!-- ====================================================== -->

        <!-- 
            Aquí JavaScript introducirá las preguntas
            dinámicamente.
        -->
        <div id="partida"></div>


        <!-- ====================================================== -->
        <!-- NAVEGACIÓN ENTRE PREGUNTAS                              -->
        <!-- ====================================================== -->

        <!-- 
            Contenedor de los botones Anterior, Siguiente
            y Resoldre.
        -->
        <div class="d-flex flex-wrap justify-content-center align-items-center gap-2 py-2 border-top">

            <!-- Botón para volver a la pregunta anterior -->
            <button id="btnAnterior" class="btn btn-primary btn-sm" disabled>Anterior</button>


            <!-- Indicador de pregunta -->
            <!-- Ejemplo: Pregunta 1 de 10 -->
            <span id="indicador" class="fw-bold small"></span>


            <!-- Botón para ir a la siguiente pregunta -->
            <button id="btnSeguent" class="btn btn-primary btn-sm" disabled>Següent</button>


            <!-- 
                Botón para finalizar el test.

                d-none:
                hace que el botón esté oculto inicialmente.

                onclick:
                cuando hacemos clic ejecuta la función
                finalitzarTest().
            -->
            <button id="btnEnviar" class="btn btn-success btn-sm d-none" onclick="enviarRespostes()"> Resoldre</button>
        </div>
    </div>
    <div class="d-flex flex-wrap justify-content-left align-items-left gap-2 py-2 ms-3 border-top">
        <a href="interfaz.html" class=" btn btn-warning">Editar</a>
    </div>


    <!-- ====================================================== -->
    <!-- JAVASCRIPT                                             -->
    <!-- ====================================================== -->

    <!-- Archivo JavaScript principal de la aplicación -->
    <script src="funcions.js"></script>

</body>

</html>
