<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Joc Preguntes</title>
</head>

<body class="bg-body-tertiary">

    <!-- Marcador -->
    <div id="marcador" class="sticky-sm-top"></div>

    <!-- Contenedor principal -->
    <!-- max-width limita el ancho de la página a 640px -->
    <div class="container py-3" style="max-width: 640px;">

        <!-- TARGETA que envolta tot el joc -->
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="text-center fw-bolder fs-3 text-primary mt-2 mb-2"> PREGUNTES AUTOESCOLA </h1>


                <!-- ====================================================== -->
                <!-- CRONÓMETRO Y USUARIO                                  -->
                <!-- ====================================================== -->

                <!-- Contenedor general de cronómetro + usuario -->
                <div class="pb-2 mb-2">


                    <!-- ===================== -->
                    <!-- FILA DEL CRONÓMETRO    -->
                    <!-- ===================== -->

                    <!-- 
                        text-center:
                        centra los elementos horizontalmente.

                        mb-2:
                        añade un pequeño margen inferior.
                    -->
                    <div class="text-center mb-2">
                        <!-- Texto del cronómetro -->
                        <span class="fw-bold">
                            <i class="text-primary bi bi-clock-fill"></i>
                             Temps: 
                            <span id="cronometre">0</span>s
                        </span>

                    </div>


                    <!-- ========================== -->
                    <!-- USUARIO                    -->
                    <!-- ========================== -->

                    <!-- 
                        Recuadro azul con el nombre del usuario (lo rellena funcions.js).
                        d-none: está oculto hasta que se sabe el nombre.

                        badge bg-primary:
                        recuadro azul con texto blanco.

                        bi-person-circle:
                        icono de perfil, a la izquierda del nombre.
                    -->
                    <div id="boxUsuari" class="text-center d-none">
                        <span class="badge bg-primary fs-6">
                            <i class="bi bi-person-circle me-1"></i>
                            <span id="nomUsuari"></span>
                        </span>
                    </div>

                </div>


                <!-- ====================================================== -->
                <!-- PARTIDA / PREGUNTAS                                    -->
                <!-- ====================================================== -->

                <!-- 
                    Aquí JavaScript introducirá las preguntas
                    dinámicamente.
                -->
                <div id="partida"></div>


                <!-- ====================================================== -->
                <!-- NAVEGACIÓN ENTRE PREGUNTAS                              -->
                <!-- ====================================================== -->

                <!-- 
                    Contenedor de los botones Anterior, Siguiente
                    y Resoldre.
                -->
                <div class="d-flex flex-wrap justify-content-center align-items-center gap-2 py-2">

                    <!-- Botón para volver a la pregunta anterior -->
                    <button id="btnAnterior" class="btn btn-primary btn-sm" disabled>Anterior</button>


                    <!-- Indicador de pregunta -->
                    <!-- Ejemplo: Pregunta 1 de 10 -->
                    <span id="indicador" class="fw-bold small"></span>


                    <!-- Botón para ir a la siguiente pregunta -->
                    <button id="btnSeguent" class="btn btn-primary btn-sm" disabled>Següent</button>


                    <!-- 
                        Botón para finalizar el test.

                        d-none:
                        hace que el botón esté oculto inicialmente.

                        onclick:
                        cuando hacemos clic ejecuta la función
                        finalitzarTest().
                    -->
                    <button id="btnEnviar" class="btn btn-success btn-sm d-none" onclick="enviarRespostes()"> Resoldre</button>
                </div>

                <div class="d-flex flex-wrap justify-content-center align-items-center gap-2 py-2">
                    <!-- HOME -->
                    <a href="index.html" class="btn btn-primary"> <i class="bi bi-house-door-fill"></i> </a>

                    <button id="btnNovaPartida" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-arrow-clockwise"></i> Nova partida
                    </button>
                </div>

            </div> <!-- /card-body -->
        </div> <!-- /card -->
    </div> <!-- /container -->


    <!-- ====================================================== -->
    <!-- JAVASCRIPT                                             -->
    <!-- ====================================================== -->

    <!-- Archivo JavaScript principal de la aplicación -->
    <script src="funcions.js"></script>

</body>

</html>
