<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Administració de preguntes</title>
</head>

<body class="bg-body-tertiary">
    <!-- container: centra el contingut i li posa marges -->
    <div class="container py-3" style="max-width: 700px;">

        <h1 class="text-center fs-3 text-primary fw-bolder">Administració de preguntes</h1>

        <!-- TARGETA del formulari (serveix per crear i per modificar) -->
        <div class="card shadow-sm mb-4">
          <div class="card-body p-4">

        <h2 class="fs-5" id="titolFormulari">Nova pregunta</h2>

        <input type="text" id="pregunta" class="form-control mb-2" placeholder="Pregunta">
        <input type="file" id="imatge" accept="image/*" class="form-control mb-3">

        <p class="mb-1">Respostes (marca la correcta):</p>
        <div class="input-group mb-1">
            <div class="input-group-text"><input type="radio" name="correcta" value="0" checked></div>
            <input type="text" id="resposta0" class="form-control">
        </div>
        <div class="input-group mb-1">
            <div class="input-group-text"><input type="radio" name="correcta" value="1"></div>
            <input type="text" id="resposta1" class="form-control">
        </div>
        <div class="input-group mb-1">
            <div class="input-group-text"><input type="radio" name="correcta" value="2"></div>
            <input type="text" id="resposta2" class="form-control">
        </div>
        <div class="input-group mb-3">
            <div class="input-group-text"><input type="radio" name="correcta" value="3"></div>
            <input type="text" id="resposta3" class="form-control">
        </div>

        <button id="btnGuardar" class="btn btn-success">Guardar</button>
        <button id="btnCancelar" class="btn btn-danger">Cancel·lar</button>
        <!-- HOME -->
         <div class="ms-3 mb-3 fixed-bottom">
             <a href="index.html" class="btn btn-primary"> <i class="bi bi-house-door-fill"></i> </a>
        </div>

          </div> <!-- /card-body -->
        </div> <!-- /card -->

        <!-- LLISTA DE PREGUNTES (la pinta JavaScript, una targeta per pregunta) -->
        <div id="llista"></div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
